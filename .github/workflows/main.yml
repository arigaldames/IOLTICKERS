name: Vigilante de Mercado

on:
  schedule:
    # Se ejecuta cada 30 minutos de lunes a viernes, de 14:00 a 20:00 UTC (11:00 a 17:00 en Argentina)
    - cron: '*/30 14-20 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3
        
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Ejecutar Vigilante
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vigilante.py
